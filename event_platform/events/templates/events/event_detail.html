<!DOCTYPE html>
<html>
<head>
    <title>{{ event.title }}</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .form-section { background: #f4f4f4; padding: 20px; margin-top: 20px; border-radius: 5px; max-width: 400px; }
        input { width: 100%; padding: 8px; margin: 10px 0; }
        button { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <a href="{% url 'event_list' %}">← Back to List</a>
    <h1>{{ event.title }}</h1>
    <p><strong>When:</strong> {{ event.date }}</p>
    <p><strong>Where:</strong> {{ event.location }}</p>
    <hr>
    <p>{{ event.description }}</p>

    <div class="form-section">
        <h3>Register for this Event</h3>
        <form action="{% url 'register_event' event.pk %}" method="POST">
            {% csrf_token %}
            <label>Full Name:</label>
            <input type="text" name="full_name" required>
            
            <label>Email Address:</label>
            <input type="email" name="email" required>
            
            <button type="submit">Submit Registration</button>
        </form>
    </div>
</body>
</html>
