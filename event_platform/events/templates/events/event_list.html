<!DOCTYPE html>
<html>
<head>
    <title>Available Events</title>
    <style>
        body { font-family: Arial; margin: 40px; line-height: 1.6; }
        .event-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        .btn { background: #007bff; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>Upcoming Events</h1>
    {% for event in events %}
    <div class="event-card">
        <h2>{{ event.title }}</h2>
        <p><strong>Date:</strong> {{ event.date }} | <strong>Location:</strong> {{ event.location }}</p>
        <a href="{% url 'event_detail' event.pk %}" class="btn">View Details & Register</a>
    </div>
    {% empty %}
    <p>No events found.</p>
    {% endfor %}
</body>
</html>
