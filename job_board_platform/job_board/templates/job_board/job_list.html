<!DOCTYPE html>
<html>
<head><title>Job Board</title></head>
<body>
    <h1>Find Your Next Job</h1>
    
    <!-- Search Form -->
    <form method="GET" action="">
        <input type="text" name="q" placeholder="Search by title, location..." value="{{ query|default:'' }}">
        <button type="submit">Search</button>
    </form>

    <hr>

    {% for job in jobs %}
    <div style="border: 1px solid #ccc; padding: 10px; margin-bottom: 10px;">
        <h3>{{ job.title }}</h3>
        <p><strong>Company:</strong> {{ job.employer.company_name }} | <strong>Location:</strong> {{ job.location }}</p>
        <a href="{% url 'job_detail' job.pk %}">View Details & Apply</a>
    </div>
    {% empty %}
    <p>No jobs found.</p>
    {% endfor %}
</body>
</html>
